<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vera</title>
<style>
  html,body{margin:0;height:100%;background:#12100e;color:#f2ece3;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;box-sizing:border-box}
  h1{font-size:44px;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
  p{max-width:22em;color:#b8ada0;margin:6px 0}
  .p{width:9px;height:9px;border-radius:50%;background:#6b6257;margin-bottom:22px;
    transition:background .4s}
  .p.si{background:#7bd88f;box-shadow:0 0 16px #7bd88f66}
  .p.no{background:#d87b7b}
  a.b{margin-top:22px;display:inline-block;padding:13px 26px;border-radius:999px;
    background:#f2ece3;color:#12100e;text-decoration:none;font-weight:600}
  code{background:#221e1a;padding:2px 7px;border-radius:5px;font-size:14px}
  input{margin-top:18px;width:min(20em,86vw);padding:14px 16px;border-radius:12px;
    border:1px solid #3a332c;background:#1b1815;color:#f2ece3;font-size:19px;
    text-align:center;box-sizing:border-box}
  input:focus{outline:none;border-color:#7bd88f}
  button{margin-top:12px;padding:13px 30px;border:0;border-radius:999px;
    background:#f2ece3;color:#12100e;font-weight:600;font-size:16px}
  .err{color:#d87b7b;min-height:1.4em;margin-top:10px;font-size:14px}
</style>
<div class="c">
  <div class="p" id="p"></div>
  <h1>Vera</h1>
  <p id="m">Un momento…</p>
  <div id="a"></div>
</div>
<script>
// Il segreto vive nel FRAMMENTO: il browser non lo manda a nessun server, quindi non e'
// mai passato di qui dentro. Se non c'e', questa e' solo una porta senza chiave.
var seg = (location.hash || "").replace(/^#/, "").trim();
var m = document.getElementById("m"), p = document.getElementById("p"), a = document.getElementById("a");

function fallita(t){ p.className = "p no"; m.textContent = t; }

if (!seg) {
  // ⚠ [g1211] Qui c'era un vicolo cieco: «sblocca il computer di Vera, compare un QR».
  // Lo schermo non e' MAI stato sbloccato — sette ore di coperchio alzato il 20/08, zero
  // sblocchi — e infatti in tre giorni nessuno ha aperto niente. L'unico canale che
  // funziona davvero e' la mia voce nella stanza, e una chiave esadecimale non ci passa.
  // Da qui si entra con TRE PAROLE, che la voce sa dire e la mano sa ribattere.
  fallita("Scrivi le tre parole che ti ho detto.");
  a.innerHTML = '<input id="k" placeholder="tre parole" autocapitalize="off" autocorrect="off" '
              + 'spellcheck="false" enterkeyhint="go"><br><button id="go">Entra</button>'
              + '<div class="err" id="e"></div>'
              + "<p style='font-size:13px;margin-top:26px'>Se invece hai il link personale che finisce col cancelletto, aprilo: entri da solo.</p>";
  var k = document.getElementById("k"), e = document.getElementById("e");
  k.focus();
  function entra(){
    var v = (k.value || "").trim();
    if (!v) return;
    e.textContent = "…";
    fetch("dove.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.host) { e.textContent = "Vera non e’ raggiungibile adesso. Riprova fra poco."; return; }
        return fetch(d.host + "/apri?parola=" + encodeURIComponent(v), {cache: "no-store"})
          .then(function(r){ return r.json(); })
          .then(function(j){
            if (j && j.seg) {
              // il link resta valido sul suo telefono: da adesso in poi non deve piu’
              // ribattere niente, gli basta riaprire la pagina.
              location.replace(d.host + "/v/" + encodeURIComponent(j.seg) + "/");
            } else if (j && j.no === "troppi-tentativi") {
              e.textContent = "Troppi tentativi sbagliati. Riprova fra un’ora.";
            } else {
              e.textContent = "Non sono queste. Riprova, o chiedimelo a voce.";
            }
          });
      })
      .catch(function(){ e.textContent = "Non riesco a leggere dove sono. Riprova fra un minuto."; });
  }
  document.getElementById("go").onclick = entra;
  k.onkeydown = function(ev){ if (ev.key === "Enter") entra(); };
} else {
  fetch("dove.json?t=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.host) { fallita("Vera in questo momento non e' raggiungibile. Riprova fra poco: appena torna online questo stesso link funziona."); return; }
      var dest = d.host + "/v/" + encodeURIComponent(seg) + "/";
      // Chiedo alla macchina di Vera se e' sveglia PRIMA di mandarci il telefono: meglio una
      // frase mia che l'errore di rete del browser in mano a un cliente.
      var ko = setTimeout(function(){ lenta(dest); }, 4000);
      fetch(d.host + "/vivo", {cache: "no-store"})
        .then(function(r){ return r.json(); })
        .then(function(v){ clearTimeout(ko); if (v && v.vivo) { p.className = "p si"; m.textContent = "Ci sono. Ti porto dentro."; location.replace(dest); } else { lenta(dest); } })
        .catch(function(){ clearTimeout(ko); lenta(dest); });
    })
    .catch(function(){ fallita("Non riesco a leggere dove sono. Riprova fra un minuto."); });
}

function lenta(dest){
  p.className = "p no";
  m.textContent = "Vera non risponde in questo momento — probabilmente il computer e' spento. Questo link resta valido: riprova piu' tardi.";
  a.innerHTML = '<a class="b" href="' + dest + '">Prova lo stesso</a>';
}
</script>
</html>
